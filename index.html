<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.typekit.net/vum4rka.css">
    <link rel="stylesheet" href="https://use.typekit.net/qua7hun.css">
    <link rel="stylesheet" href="./styles/loader.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <section class="container">
        <article class="container-direction oculto" id="firstContainer">
            <article class="custom_container">
                <h3 class="apeace_title">Your Apeace</h3>
                <div class="custom">
                    <img src="../img/background/orange.jpg" class="apeace_img defaultBg delete"
                        style="width: 100%; height: 100%; z-index: 3;">
                    <img src="../img/fur/Black.png" alt="" class="apeace_img fur defaultFur delete"
                        style="width: 100%; height: 100%; z-index: 4;">
                </div>
                <button class="btn_create" id="btnCreate">Create</button>
            </article>
            <article class="list_container">
                <ul class="traits_list">
                    <ul class="second_traits_list">
                        <a class="traits" id="backgroundTrait" href="#optionsBg">Background</a>
                        <a class="traits" id="furTrait" href="#optionsFur">Fur</a>
                        <a class="traits" id="nailsTrait" href="#optionsNails">Nails</a>
                    </ul>
                    <ul class="second_traits_list">
                        <a class="traits" id="clothesTrait" href="#optionsClothes">Clothing</a>
                        <a class="traits" id="fingerTrait" href="#optionsFinger">Finger</a>
                        <a class="traits" id="holdTrait" href="#optionsHolding">Holding</a>
                        <a class="traits" id="wristTrait" href="#optionsWrist">Wrist</a>
                    </ul>
                </ul>
                <div class="options_container" id="variants">
                    <div id="optionsBg" class="traits_container">
                    </div>
                    <div id="optionsFur" class="traits_container">
                    </div>
                    <div id="optionsClothes" class="traits_container">
                    </div>
                    <div id="optionsFinger" class="traits_container">
                    </div>
                    <div id="optionsHolding" class="traits_container">
                    </div>
                    <div id="optionsNails" class="traits_container">
                    </div>
                    <div id="optionsWrist" class="traits_container">
                    </div>
            </article>
        </article>
        <article class="custom_product_container" id="thirdContainer">
            <h3 class="custom_product_title">Your custom product</h3>
            <div class="product_img_container">
                <div id="result" class="result"></div>
                <div class="sk-fading-circle loader_container oculto">
                    <div class="sk-circle1 sk-circle"></div>
                    <div class="sk-circle2 sk-circle"></div>
                    <div class="sk-circle3 sk-circle"></div>
                    <div class="sk-circle4 sk-circle"></div>
                    <div class="sk-circle5 sk-circle"></div>
                    <div class="sk-circle6 sk-circle"></div>
                    <div class="sk-circle7 sk-circle"></div>
                    <div class="sk-circle8 sk-circle"></div>
                    <div class="sk-circle9 sk-circle"></div>
                    <div class="sk-circle10 sk-circle"></div>
                    <div class="sk-circle11 sk-circle"></div>
                    <div class="sk-circle12 sk-circle"></div>
                </div>
                <form id="upload-form" style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                    <input type="file" id="image-input" name="image" accept="image/*" required>
                    <div>
                        <button type="submit" class="btn_upload" id="btnUpload">Upload Image</button>
                        <p>The upload can take a few seconds...</p>
                    </div>
                </form>
                <button onclick="location.reload()" class="btn_back">Back</button>
            </div>
        </article>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./node_modules/html2canvas/dist/html2canvas.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="./js/listColor.js"></script>
    <script src="./js/index.js"></script>
    <script src="./js/form.js"></script>
</body>

</html>
